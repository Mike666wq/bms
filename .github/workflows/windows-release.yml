name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and run self-tests
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\run-self-test.ps1

      - name: Package runtime folder
        id: package
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $exe = '.testing\stage2\BmsRealtimeDemo.exe'
          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          $version = $fileVersion -replace '\.0$',''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match EXE file version $version"
            }
          }
          .\package.ps1 -Version $version -BuildDirectory '.testing\stage2'
          $zip = (Resolve-Path ("release\BmsRealtimeDemo-Windows-$version.zip")).Path
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BmsRealtimeDemo-Windows-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = '${{ steps.package.outputs.zip }}'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorActionPreference
          if (-not $releaseExists) {
            gh release create $tag --title "BMS $tag" --generate-notes
          }
          gh release upload $tag $zip --clobber
