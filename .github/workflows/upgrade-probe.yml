name: upgrade-probe

# 验证「升级不换设备编号」：整包替换前后各跑一次 --dump-paths，比较 deviceId。
# 这是原问题的核心——现场反馈「每次更新都要去网页重新注册」，就是编号变了。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 首次安装
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Mike666wq/bms/releases/download/v1.3.7/BmsRealtimeDemo-Windows-1.3.7.zip'
          Invoke-WebRequest -Uri $url -OutFile bms.zip
          Expand-Archive bms.zip -DestinationPath app -Force
          Get-ChildItem app -Recurse -Filter '*.exe' | Select-Object FullName

      - name: 首次运行（生成身份）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app -Recurse -Filter 'BmsRealtimeDemo.exe' | Select-Object -First 1).FullName
          $dir = Split-Path $exe -Parent
          $p = Start-Process -FilePath $exe -ArgumentList '--dump-paths' -WorkingDirectory $dir -PassThru -Wait
          Write-Host "exit=$($p.ExitCode)"
          $f = Join-Path $dir 'bms-paths.txt'
          Get-Content $f | ForEach-Object { Write-Host $_ }
          $m = [regex]::Match((Get-Content $f -Raw), 'deviceId=(.+)')
          if (-not $m.Success) { Write-Host 'FAIL: 首次运行没拿到 deviceId'; exit 1 }
          $first = $m.Groups[1].Value.Trim()
          Write-Host "::notice title=FirstInstall::deviceId=$first"
          Set-Content -Path first-id.txt -Value $first
          $pd = 'C:\ProgramData\BmsSerialDemo\settings\device-id.txt'
          if (Test-Path $pd) { Write-Host "ProgramData device-id=$(Get-Content $pd -Raw)" } else { Write-Host 'ProgramData 无 device-id.txt' }

      - name: 模拟升级（整包替换）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 现场升级就是把安装目录整个换掉；身份必须活下来。
          Remove-Item app -Recurse -Force
          Expand-Archive bms.zip -DestinationPath app -Force
          Write-Host '安装目录已整体替换'

      - name: 升级后运行
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app -Recurse -Filter 'BmsRealtimeDemo.exe' | Select-Object -First 1).FullName
          $dir = Split-Path $exe -Parent
          $p = Start-Process -FilePath $exe -ArgumentList '--dump-paths' -WorkingDirectory $dir -PassThru -Wait
          Write-Host "exit=$($p.ExitCode)"
          $f = Join-Path $dir 'bms-paths.txt'
          Get-Content $f | ForEach-Object { Write-Host $_ }
          $m = [regex]::Match((Get-Content $f -Raw), 'deviceId=(.+)')
          if (-not $m.Success) { Write-Host 'FAIL: 升级后没拿到 deviceId'; exit 1 }
          $second = $m.Groups[1].Value.Trim()
          Write-Host "::notice title=AfterUpgrade::deviceId=$second"

      - name: 断言编号未变
        shell: pwsh
        run: |
          $first = (Get-Content first-id.txt -Raw).Trim()
          $exe = (Get-ChildItem app -Recurse -Filter 'BmsRealtimeDemo.exe' | Select-Object -First 1).FullName
          $dir = Split-Path $exe -Parent
          $m = [regex]::Match((Get-Content (Join-Path $dir 'bms-paths.txt') -Raw), 'deviceId=(.+)')
          $second = $m.Groups[1].Value.Trim()
          Write-Host "first =$first"
          Write-Host "second=$second"
          if ($first -eq $second -and $first.StartsWith('mk_')) {
            Write-Host "::notice title=UpgradeStable::PASS deviceId 未变 $first"
          } else {
            Write-Host "::error title=UpgradeBroke::FAIL 升级后编号变了 first=$first second=$second"
            exit 1
          }
